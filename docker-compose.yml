services:
  postgres:
    image: postgres:16-alpine
    container_name: logisights-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logisights
      POSTGRES_USER: logisights
      POSTGRES_PASSWORD: logisights_secret
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logisights -d logisights"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
