# Copy this file to application.properties before running the app locally.
# application.properties is gitignored so real credentials never get committed;
# the ${VAR:default} placeholders below are safe defaults for local dev only.

quarkus.application.name=logisights-be

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:logisights}
quarkus.datasource.password=${DB_PASSWORD:logisights_secret}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5435/logisights}

# --- Hibernate ORM (Flyway owns the schema, Hibernate just validates it) ---
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# --- JWT ---
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://logisights.co.ke
smallrye.jwt.sign.key.location=privateKey.pem
logisights.jwt.expiry-minutes=1440

# --- Resend (email) ---
resend.api-key=${RESEND_API_KEY:changeme}
resend.base-url=https://api.resend.com
quarkus.rest-client.resend-api.url=${resend.base-url}
mail.from-address=${MAIL_FROM_ADDRESS:Logisights <notifications@logisights.co.ke>}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.admin-alert-email=${ADMIN_ALERT_EMAIL:ops@logisights.co.ke}

# --- M-Pesa Daraja ---
mpesa.base-url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
mpesa.consumer-key=${MPESA_CONSUMER_KEY:changeme}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:changeme}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY:changeme}
mpesa.callback-url=${MPESA_CALLBACK_URL:https://example.ngrok.io/payments/mpesa/callback}
quarkus.rest-client.daraja-api.url=${mpesa.base-url}

# --- Pricing ---
pricing.base-cost-kes=200
pricing.cost-per-kg-kes=50

# --- Driver earnings ---
driver.earnings-per-delivery-kes=150

# --- CORS (frontend dev server) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}

%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.flyway.clean-at-start=false

# --- Test datasource: a separate database from dev, never the one docker-compose
# brings up for local dev. Same Postgres instance, different DB name, so a test
# run's drop-and-create can never touch dev/manually-seeded data. ---
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=${TEST_DB_USERNAME:logisights}
%test.quarkus.datasource.password=${TEST_DB_PASSWORD:logisights_secret}
%test.quarkus.datasource.jdbc.url=${TEST_DB_URL:jdbc:postgresql://localhost:5435/logisights_test}
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false
