{#include notification/layout.html}
<h1 class="email-heading" style="font-size:22px;font-weight:700;color:#111827;margin:0 0 16px;">Parcel booked, {name}</h1>
<p class="email-text" style="font-size:15px;line-height:1.6;color:#374151;margin:0 0 16px;">
  Your parcel to <strong>{destinationAddress}</strong> is booked and ready for pickup.
</p>
<table role="presentation" style="width:100%;background-color:#f9fafb;border-radius:8px;margin:0 0 24px;">
  <tr><td style="padding:16px;">
    <p style="font-size:12px;color:#6b7280;font-weight:600;text-transform:uppercase;margin:0 0 4px;">Tracking ID</p>
    <p style="font-size:20px;font-weight:700;color:#4f46e5;margin:0 0 12px;">{trackingId}</p>
    <p style="font-size:12px;color:#6b7280;font-weight:600;text-transform:uppercase;margin:0 0 4px;">Cost</p>
    <p style="font-size:16px;color:#111827;margin:0;">KES {costKes}</p>
  </td></tr>
</table>
<p style="margin:0 0 24px;">
  <a href="{trackUrl}" style="background-color:#4f46e5;color:#ffffff;border-radius:6px;font-size:15px;font-weight:600;padding:12px 24px;text-decoration:none;display:inline-block;">Track your parcel</a>
</p>
{/include}
