{#include notification/layout.html}
<h1 class="email-heading" style="font-size:22px;font-weight:700;color:#111827;margin:0 0 16px;">Parcel {trackingId} is now {status}</h1>
<p class="email-text" style="font-size:15px;line-height:1.6;color:#374151;margin:0 0 16px;">
  Hi {name}, your parcel status has changed to <strong>{status}</strong>.
</p>
{#if note}
<p class="email-text" style="font-size:14px;color:#6b7280;margin:0 0 16px;">{note}</p>
{/if}
<p style="margin:0 0 24px;">
  <a href="{trackUrl}" style="background-color:#4f46e5;color:#ffffff;border-radius:6px;font-size:15px;font-weight:600;padding:12px 24px;text-decoration:none;display:inline-block;">View tracking details</a>
</p>
{/include}
