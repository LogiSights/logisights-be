<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logisights</title>
<style>
  @media (prefers-color-scheme: dark) {
    .email-body { background-color: #0f0f0f !important; }
    .email-container { background-color: #1a1a1a !important; }
    .email-text { color: #e5e5e5 !important; }
    .email-heading { color: #ffffff !important; }
    .email-divider { border-color: #333333 !important; }
  }
</style>
</head>
<body class="email-body" style="margin:0;padding:0;background-color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" class="email-container" style="max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:24px 32px;border-bottom:1px solid #e5e5e5;">
              <span style="font-size:18px;font-weight:700;color:#111827;">Logisights</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {#insert /}
            </td>
          </tr>
          <tr>
            <td class="email-divider" style="border-top:1px solid #e5e5e5;padding:24px 32px;">
              <p class="email-text" style="font-size:12px;color:#6b7280;text-align:center;margin:4px 0;">
                Logisights &middot; Nairobi, Kenya
              </p>
              <p style="font-size:12px;color:#6b7280;text-align:center;margin:4px 0;">
                This is a transactional message related to your Logisights account.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
