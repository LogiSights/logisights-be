{#include notification/layout.html}
<h1 class="email-heading" style="font-size:22px;font-weight:700;color:#111827;margin:0 0 16px;">Your earnings, {weekLabel}</h1>
<p class="email-text" style="font-size:15px;line-height:1.6;color:#374151;margin:0 0 16px;">Hi {name}, here's your weekly summary.</p>
<table role="presentation" style="width:100%;background-color:#f9fafb;border-radius:8px;margin:0 0 24px;">
  <tr><td style="padding:16px;">
    <p style="font-size:12px;color:#6b7280;font-weight:600;text-transform:uppercase;margin:0 0 4px;">Total earned</p>
    <p style="font-size:24px;font-weight:700;color:#4f46e5;margin:0 0 12px;">KES {totalKes}</p>
    <p style="font-size:12px;color:#6b7280;font-weight:600;text-transform:uppercase;margin:0 0 4px;">Completed deliveries</p>
    <p style="font-size:16px;color:#111827;margin:0;">{deliveries}</p>
  </td></tr>
</table>
{/include}
