{#include notification/layout.html}
<h1 class="email-heading" style="font-size:22px;font-weight:700;color:#111827;margin:0 0 16px;">Confirm your email, {name}</h1>
<p class="email-text" style="font-size:15px;line-height:1.6;color:#374151;margin:0 0 16px;">
  Welcome to Logisights. Confirm your email address to activate your account.
</p>
<p style="margin:0 0 24px;">
  <a href="{verifyUrl}" style="background-color:#4f46e5;color:#ffffff;border-radius:6px;font-size:15px;font-weight:600;padding:12px 24px;text-decoration:none;display:inline-block;">Verify email address</a>
</p>
<p class="email-text" style="font-size:13px;color:#6b7280;">
  Button not working? Copy and paste this link into your browser:<br>
  <a href="{verifyUrl}" style="color:#4f46e5;">{verifyUrl}</a>
</p>
<p class="email-text" style="font-size:13px;color:#6b7280;">This link expires in 24 hours.</p>
{/include}
