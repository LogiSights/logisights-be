name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logisights_test
          POSTGRES_USER: logisights
          POSTGRES_PASSWORD: logisights_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logisights -d logisights_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/logisights_test
      TEST_DB_USERNAME: logisights
      TEST_DB_PASSWORD: logisights_secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate dev JWT signing keypair
        run: |
          cd src/main/resources
          openssl genrsa -out privateKey.pem 2048
          openssl rsa -in privateKey.pem -pubout -out publicKey.pem

      - name: Build, test, and enforce coverage gate
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
